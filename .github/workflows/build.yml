name: Build

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # This module compiles at source/target 20.
          java-version: '21'
          cache: maven

      # None of the three sibling libraries are on Maven Central at the versions this module
      # depends on, so each is built from source. A branch of the same name wins when one
      # exists, because a change spanning several of these repositories is developed on
      # matching branches; otherwise main. Order matters -- Nds4j underpins the other two.
      - name: Build upstream libraries
        run: |
          set -euo pipefail
          ref="${{ github.head_ref || github.ref_name }}"
          for repo in Nds4j Nds4j-ToolUI PokEditor-Core; do
            target="$ref"
            if ! git ls-remote --exit-code --heads "https://github.com/turtleisaac/$repo.git" "$ref" >/dev/null 2>&1; then
              target=main
            fi
            echo "::group::$repo @ $target"
            git clone --quiet --depth 1 --branch "$target" \
              "https://github.com/turtleisaac/$repo.git" ".upstream/$repo"
            mvn -B -ntp -q install -DskipTests -f ".upstream/$repo/pom.xml"
            echo "::endgroup::"
          done

      # Attributed up front, so an unresolvable dependency is reported as itself rather than
      # surfacing later as an unexplained compilation failure.
      - name: Verify dependencies resolve
        run: |
          set +e
          output=$(mvn -B -ntp dependency:resolve 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "$output" | tail -40
            if echo "$output" | grep -q "VariableTracker"; then
              echo "::error title=Unpublished dependency blocks this build::io.github.turtleisaac:VariableTracker:1.0-SNAPSHOT is not published to any repository this build can reach, and pom.xml declares no <repositories> entry for it. PokEditor therefore cannot be built from a clean checkout -- not by CI, and not by a new contributor. Fix by publishing VariableTracker, adding a <repositories> entry that serves it, or vendoring it into this repository."
            fi
            exit "$status"
          fi

      - name: Build and test
        # Everything except the dead-code specifications below. This job must stay green: a
        # failure here is a regression, and it is only readable as one because the known
        # failures are not mixed in with it.
        run: mvn -B -ntp verify -Djava.awt.headless=true -DexcludedGroups=dead-code

      # Tests asserting properties that framework/ and gui_old/ classes do not hold. Those
      # classes have no callers anywhere in src/main, so the failures are not defects anyone
      # can hit - they are the specification for whoever revives or deletes the code.
      #
      # The count is asserted rather than reported. A bare "expected to fail" job is decorative:
      # nothing notices when the number goes up, so a genuine regression could be silenced by
      # tagging it, and nothing notices when it goes down either, so a fix never prompts anyone
      # to remove the tag. Pinning the number makes both show up as a build failure.
      - name: Known dead-code failures
        run: |
          set +e
          output=$(mvn -B -ntp test -Djava.awt.headless=true -Dgroups=dead-code 2>&1)
          set -e
          summary=$(echo "$output" | grep -E '^\[(ERROR|INFO|WARNING)\] Tests run: [0-9]+, Failures' | tail -1)
          echo "$summary"
          run=$(echo "$summary" | sed -E 's/.*Tests run: ([0-9]+).*/\1/')
          failures=$(echo "$summary" | sed -E 's/.*Failures: ([0-9]+).*/\1/')
          errors=$(echo "$summary" | sed -E 's/.*Errors: ([0-9]+).*/\1/')
          red=$(( failures + errors ))
          if [ "$run" != "$EXPECTED_TAGGED" ]; then
            echo "::error title=Tagged test count changed::$run tests carry the dead-code tag, expected $EXPECTED_TAGGED. If you added a tag, say why in the commit and update EXPECTED_TAGGED; a regression must not be tagged away."
            exit 1
          fi
          if [ "$red" -lt "$EXPECTED_RED" ]; then
            echo "::notice title=A known failure now passes::$red of $run tagged tests fail, down from $EXPECTED_RED. Something was fixed -- remove its @Tag(DEAD_CODE) and lower EXPECTED_RED."
            exit 1
          fi
          if [ "$red" -gt "$EXPECTED_RED" ]; then
            echo "::error title=More tagged tests failing::$red of $run tagged tests fail, up from $EXPECTED_RED."
            exit 1
          fi
          echo "$red of $run tagged tests fail, as expected."
        env:
          # Keep in step with the @Tag(DEAD_CODE) annotations in src/test.
          EXPECTED_TAGGED: '17'
          EXPECTED_RED: '17'

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/target/surefire-reports/**
            **/target/*.log
          if-no-files-found: ignore
