name: Build

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # This module compiles at source/target 20.
          java-version: '21'
          cache: maven

      # None of the three sibling libraries are on Maven Central at the versions this module
      # depends on, so each is built from source. A branch of the same name wins when one
      # exists, because a change spanning several of these repositories is developed on
      # matching branches; otherwise main. Order matters -- Nds4j underpins the other two.
      - name: Build upstream libraries
        run: |
          set -euo pipefail
          ref="${{ github.head_ref || github.ref_name }}"
          for repo in Nds4j Nds4j-ToolUI PokEditor-Core; do
            target="$ref"
            if ! git ls-remote --exit-code --heads "https://github.com/turtleisaac/$repo.git" "$ref" >/dev/null 2>&1; then
              target=main
            fi
            echo "::group::$repo @ $target"
            git clone --quiet --depth 1 --branch "$target" \
              "https://github.com/turtleisaac/$repo.git" ".upstream/$repo"
            mvn -B -ntp -q install -DskipTests -f ".upstream/$repo/pom.xml"
            echo "::endgroup::"
          done

      # Attributed up front, so an unresolvable dependency is reported as itself rather than
      # surfacing later as an unexplained compilation failure.
      - name: Verify dependencies resolve
        run: |
          set +e
          output=$(mvn -B -ntp dependency:resolve 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "$output" | tail -40
            if echo "$output" | grep -q "VariableTracker"; then
              echo "::error title=Unpublished dependency blocks this build::io.github.turtleisaac:VariableTracker:1.0-SNAPSHOT is not published to any repository this build can reach, and pom.xml declares no <repositories> entry for it. PokEditor therefore cannot be built from a clean checkout -- not by CI, and not by a new contributor. Fix by publishing VariableTracker, adding a <repositories> entry that serves it, or vendoring it into this repository."
            fi
            exit "$status"
          fi

      - name: Build and test
        # Everything except the dead-code specifications below. This job must stay green: a
        # failure here is a regression, and it is only readable as one because the known
        # failures are not mixed in with it.
        run: mvn -B -ntp verify -Djava.awt.headless=true -DexcludedGroups=dead-code

      # Tests asserting properties that framework/ and gui_old/ classes do not hold. Those
      # classes have no callers anywhere in src/main, so the failures are not defects anyone
      # can hit - they are the specification for whoever revives or deletes the code.
      #
      # The count is asserted rather than reported. A bare "expected to fail" job is decorative:
      # nothing notices when the number goes up, so a genuine regression could be silenced by
      # tagging it, and nothing notices when it goes down either, so a fix never prompts anyone
      # to remove the tag. Pinning the number makes both show up as a build failure.
      - name: Known dead-code failures
        run: |
          set +e
          output=$(mvn -B -ntp test -Djava.awt.headless=true -Dgroups=dead-code 2>&1)
          set -e
          summary=$(echo "$output" | grep -E '^\[(ERROR|INFO|WARNING)\] Tests run: [0-9]+, Failures' | tail -1)
          echo "$summary"
          run=$(echo "$summary" | sed -E 's/.*Tests run: ([0-9]+).*/\1/')
          failures=$(echo "$summary" | sed -E 's/.*Failures: ([0-9]+).*/\1/')
          errors=$(echo "$summary" | sed -E 's/.*Errors: ([0-9]+).*/\1/')
          red=$(( failures + errors ))
          if [ "$run" != "$EXPECTED_TAGGED" ]; then
            echo "::error title=Tagged test count changed::$run tests carry the dead-code tag, expected $EXPECTED_TAGGED. If you added a tag, say why in the commit and update EXPECTED_TAGGED; a regression must not be tagged away."
            exit 1
          fi
          if [ "$red" -lt "$EXPECTED_RED" ]; then
            echo "::notice title=A known failure now passes::$red of $run tagged tests fail, down from $EXPECTED_RED. Something was fixed -- remove its @Tag(DEAD_CODE) and lower EXPECTED_RED."
            exit 1
          fi
          if [ "$red" -gt "$EXPECTED_RED" ]; then
            echo "::error title=More tagged tests failing::$red of $run tagged tests fail, up from $EXPECTED_RED."
            exit 1
          fi
          echo "$red of $run tagged tests fail, as expected."
        env:
          # Keep in step with the @Tag(DEAD_CODE) annotations in src/test.
          EXPECTED_TAGGED: '17'
          EXPECTED_RED: '17'

      # The jar handed to testers and attached to releases. It is built here because it was
      # previously assembled by hand outside the repository, which is how it came to ship
      # without the two look-and-feel fixes below.
      - name: Build the runnable jar
        run: mvn -B -ntp -Pdist package -DskipTests

      # Building it is not the same as checking it. Shade succeeds whether or not the manifest
      # carries Add-Exports and whether or not WinLaF's classes made it in, so a build-only step
      # would go green on exactly the artifact that crashes for a user. Both halves are executed
      # here, and the second is executed against a deliberate negative so the check cannot
      # quietly become decorative.
      - name: Verify the runnable jar
        run: |
          set -euo pipefail
          jar=target/PokEditor-3.2.0-dist.jar
          javac -cp "$jar" -d target/probe .github/probe/JideResolutionProbe.java

          # Continuation lines in a manifest begin with a single space and the break can fall
          # mid-token: this value spans three lines and currently splits sun.awt.shell across
          # two. Which tokens split moves with the value, so the raw file has to be unfolded --
          # otherwise a present package can read as absent, and a split one becomes a garbage
          # --add-exports flag rather than an error.
          exports=$(unzip -p "$jar" META-INF/MANIFEST.MF | python3 .github/probe/manifest_value.py Add-Exports)
          main=$(unzip -p "$jar" META-INF/MANIFEST.MF | python3 .github/probe/manifest_value.py Main-Class)
          echo "Main-Class:  $main"
          echo "Add-Exports: $exports"

          if [ "$main" != "io.github.turtleisaac.pokeditor.Main" ]; then
            echo "::error title=The jar is not runnable::Main-Class is '$main'. Launching it with java -jar will fail."
            exit 1
          fi

          # 1. This runner's own conditions. No JDK outside Windows ships
          #    com.sun.java.swing.plaf.windows, so the system-scoped WinLaF.jar is the only thing
          #    satisfying the resolution -- and the shade plugin drops system scope unless the
          #    pom unpacks it. Nothing in src/main names that class, so this step is what stands
          #    between someone deleting WinLaF.jar as dead weight and a user hitting
          #    NoClassDefFoundError on their first keystroke in a sheet.
          if ! java -cp "$jar:target/probe" JideResolutionProbe; then
            echo "::error title=WinLaF classes are missing from the jar::The look-and-feel class jide-oss resolves is absent, so building any JIDE component dies with NoClassDefFoundError. The dist profile unpacks WinLaF.jar because <scope>system</scope> is neither compile nor runtime and the shade plugin resolves neither."
            exit 1
          fi

          # 2. Windows. There the JDK does ship that package, inside java.desktop, which does not
          #    export it -- so resolution fails with IllegalAccessError no matter what is on the
          #    classpath, and only the manifest entry helps. The condition is reproduced by
          #    patching the class into java.desktop so it is present but encapsulated, exactly as
          #    it is there, and by giving jide-oss an os.version it recognises: its table stops at
          #    6.2, so on Windows 10 and 11 its own isWindowsVistaAbove() is false and the crash
          #    arrives by a different branch.
          #
          #    The exports the jar itself declares are what get applied, so trimming the manifest
          #    fails this step. On the command line the JVM warns about the packages java.desktop
          #    does not have on Linux; in the manifest form the shipped jar uses, it is silent.
          mkdir -p target/winpatch
          unzip -qo "$jar" 'com/sun/java/swing/plaf/windows/*' -d target/winpatch
          flags=""
          for token in $exports; do flags="$flags --add-exports $token=ALL-UNNAMED"; done

          if ! java -Dos.name="Windows 7" -Dos.version="6.1" \
                    --patch-module java.desktop=target/winpatch $flags \
                    -cp "$jar:target/probe" JideResolutionProbe; then
            echo "::error title=The jar would crash on Windows::The Add-Exports entry in its manifest does not cover com.sun.java.swing.plaf.windows, so typing into a combo box in a sheet throws IllegalAccessError. See the dist profile in pom.xml."
            exit 1
          fi

          # The negative. If this passes, the check above proves nothing -- either the simulation
          # stopped reproducing the Windows condition or the probe stopped reaching the code that
          # fails, and in both cases the step needs fixing rather than trusting.
          echo "Negative control (an IllegalAccessError here is the expected result):"
          if java -Dos.name="Windows 7" -Dos.version="6.1" \
                  --patch-module java.desktop=target/winpatch \
                  -cp "$jar:target/probe" JideResolutionProbe >/dev/null 2>&1; then
            echo "::error title=This step no longer proves anything::The probe passed without any --add-exports, so it is not reaching the resolution that fails on Windows. Fix the check; do not delete it."
            exit 1
          fi
          echo "Verified: resolves on this runner, resolves under the Windows condition, and fails without the manifest entry."

      - name: Upload the runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: PokEditor-jar
          path: target/PokEditor-3.2.0-dist.jar
          if-no-files-found: error

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/target/surefire-reports/**
            **/target/*.log
          if-no-files-found: ignore
